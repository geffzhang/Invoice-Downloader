name: Core Python tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native macOS dependency
        if: runner.os == 'macOS'
        run: brew install zbar
      - name: Install test dependencies
        run: python -m pip install -r requirements.test.txt
      - name: Record runtime versions
        run: |
          python --version
          node --version
          python -m pip --version
          python -m pytest --version
          python -m pip list --format=freeze
      - name: Collect tests
        run: python -m pytest --collect-only -q
      - name: Run core regression suite
        run: python -m pytest -q
